# ============================================================================
# fleet.example.yaml — the catalogue. Copy it, keep what you own, delete the rest.
# ============================================================================
#
#   cp fleet.example.yaml fleet.yaml
#   $EDITOR fleet.yaml
#   python3 scripts/fleet.py inventory
#
# `fleet.yaml` is yours and is gitignored. This file is the template and the
# format documentation, so it stays in the repo.
#
# Nothing below is required. A fleet with one free account works. A fleet with
# none still lets the skill do all the creative work — the fleet only decides
# where footage comes from.
#
# ---------------------------------------------------------------------------
# NO PLATFORM IS KNOWN TO THE CODE BY NAME.
#
# The scripts read this file; they contain no list of vendors. Two fields carry
# everything:
#
#   access:    what it costs you and who does the clicking
#   protocol:  the SHAPE of the API, which decides how to talk to it
#
# So adding a service nobody has heard of is a config block, not a code change.
# Copy the blank template at the bottom, fill it in, done.
# ---------------------------------------------------------------------------
#
# access — the field that decides everything
#
#   api        Working API, key in your environment. The agent generates directly.
#   ui         Web-only subscription, no usable API. The agent writes copy-paste
#              prompts; you generate in the browser and drop files into inbox/.
#              Costs credits you already own. NO NEW SPEND.
#   api-paid   API exists but needs credits bought on top of the subscription.
#              The agent ALWAYS warns and quotes an estimate first.
#   host       The agent's own environment renders it. No key, no browser step,
#              none of your platform credits. See the `host` block below.
#   off        Ignored entirely.
#
# protocol — how to talk to it (omit and the id is tried as a fallback)
#
#   magica-like   modelId in the path, params nested under `input`, submit→poll
#   fal-like      queue submit → poll → result
#   heygen-like   avatar/talking-head video jobs
#   host          rendered by the agent's own tools, no HTTP at all
#
# A service whose API matches one of those shapes needs no code. One that does
# not is reported as "no backend speaks this protocol" and routed to the manual
# path — which still works fine.
# ============================================================================


# ============================================================================
# GLOBAL PREFERENCES
# ============================================================================
preferences:
  # Never buy credits without asking. Keep true unless you want the agent to
  # use paid APIs freely.
  require_approval_for_paid: true

  # Hard ceiling per production run, USD. 0 forbids all paid generation.
  max_spend_per_run_usd: 0

  # Prefer platforms whose credits you already own, even at some quality cost.
  prefer_included_credits: true

  # Spread work across accounts instead of draining one.
  rotate_accounts: true

  # Of several accounts, use the one with the most left. Keeps every account
  # viable instead of exhausting them one at a time.
  prefer_fullest_account: true

  # Warn when an account drops below this share of its budget.
  low_budget_warn_pct: 15

  # A hand-typed balance older than this many days is reported as an estimate
  # rather than a fact. Only affects platforms with balance_source: manual.
  balance_stale_after_days: 7

  # Warn this many days before credits reset, so use-it-or-lose-it pools get
  # spent instead of silently expiring.
  expiry_warn_days: 7

  # NEVER set true. Automating consumer web UIs violates their terms of service
  # and risks the accounts themselves. The skill refuses regardless; this flag
  # exists only to record the decision.
  allow_browser_automation: false


# ============================================================================
# PLATFORMS
#
# Uncomment what you have. Delete what you don't. Copy the blank template for
# anything not listed.
# ============================================================================
platforms:

  # --------------------------------------------------------------------------
  # THE HOST — the agent's own generation tools.
  #
  # Keep this block if the agent you're running has built-in generation (many
  # chat hosts do). It is the cheapest route that exists: no key, no browser,
  # none of your credits.
  #
  # Set `access: off` when running somewhere without these tools and the rest of
  # the fleet carries on unchanged. That one line is the whole portability story
  # — the skill moves between hosts without edits.
  #
  # `models` matters: `fleet.py inventory` compares it against your paid
  # platforms and tells you when you're about to spend credits on a model that
  # renders here for free.
  # --------------------------------------------------------------------------
  - id: host
    label: "Agent host (built-in generation)"
    access: host
    protocol: host
    priority: 0

    # Tool names the agent calls. Defaults shown; rename to match your host.
    tools:
      video: GenerateVideo
      image: GenerateImage
      audio: GenerateAudio
      avatar: GenerateAvatarVideo

    models: [veo-3.1, nano-banana, nano-banana-pro, gpt-image-2]

    can: [video, video-with-audio, image-to-video, image, audio, tts,
          avatar-video, lipsync]
    best_for: [hero-shots, physical-realism, text-legibility, native-audio,
               keyframes, fast-iteration]
    weak_at: [long-clips, 4k]

    max_clip_seconds: 8

    notes: >
      Renders in-conversation with no manual step. Clip length is short, so
      sequences are stitched in post. Check whether your host caps resolution —
      if you need 4K, that is a reason to use a paid platform for that one shot.

  # --------------------------------------------------------------------------
  # Aggregator with a real API — one key, many third-party models.
  # Pattern: modelId in the path, params nested under `input`.
  # --------------------------------------------------------------------------
  # - id: magica
  #   label: "magica.ai"
  #   access: api
  #   protocol: magica-like
  #   priority: 1
  #
  #   endpoint: https://api.magica.com/api/v1
  #   auth_scheme: bearer                    # Authorization: Bearer <key>
  #   auth_env: MAGICA_API_KEY               # one account
  #   auth_env_pattern: MAGICA_API_KEY_{n}   # several: numbered env vars
  #   accounts: 6
  #
  #   budget_per_account: 40000000
  #   unit: credits
  #
  #   subscription:
  #     seats: 6
  #     cost_per_month_usd: 0
  #     resets: never                        # monthly | daily | never
  #     balance_source: api                  # readable programmatically
  #
  #   rate_limit:
  #     per_min: 60
  #     per_day: 1000
  #
  #   can: [image, video, image-to-video, lipsync, tts, audio]
  #   best_for: [bulk-drafts, iteration, image-to-video, automation]
  #   weak_at: [close-up-lipsync, native-audio-video]
  #
  #   notes: >
  #     Aggregates many models behind one API. Browse the catalogue before
  #     assuming a model is available; ids change.

  # --------------------------------------------------------------------------
  # Multi-model web suite, NO public API (the common case).
  # You generate in the browser; the agent writes the packet and assembles.
  # --------------------------------------------------------------------------
  # - id: mitte
  #   label: "Mitte (AI Creative Suite)"
  #   access: ui
  #   priority: 2
  #
  #   url: https://mitte.ai
  #   accounts: 14
  #   budget_per_account: 21400
  #   unit: credits
  #
  #   subscription:
  #     seats: 14
  #     cost_per_month_usd: 0
  #     credits_per_month: 300000
  #     resets: monthly                # credits do NOT roll over
  #     renews_on: "2026-08-15"
  #     verified_on: "2026-07-26"      # when you last checked the balance
  #     balance_source: manual         # no API — typed in by hand
  #
  #   # List what this platform gives you. Models that also run on the host are
  #   # flagged by `inventory` as credits you don't need to spend.
  #   models: [seedance-2, sora-2, hailuo-2.3, kling, seedream-5, flux,
  #            veo-3.1, nano-banana-pro, gpt-image-2]
  #
  #   can: [image, video, video-with-audio, image-to-video, audio]
  #   best_for: [model-variety, 4k, stylised]
  #   weak_at: [automation, predictable-billing]
  #
  #   manual_workflow:
  #     steps:
  #       - "Open the app, pick the account with credits left"
  #       - "Paste the prompt from the generation packet"
  #       - "Set model, aspect ratio, duration and quality as specified"
  #       - "Attach the reference image when the shot calls for image-to-video"
  #       - "Generate, download the file"
  #       - "Save as inbox/<shot-id>.mp4 using the packet's filename"
  #
  #   notes: >
  #     One credit balance across many models. The price on the generate button
  #     is an ESTIMATE — independent testing found configurations billing several
  #     times the displayed figure, and the balance can go negative. Read the
  #     usage log after a run rather than trusting the panel. Cost varies
  #     enormously within one model by duration, resolution and options.

  # --------------------------------------------------------------------------
  # Consumer subscription to a frontier model — UI only.
  # The matching API is almost always a separate, separately-billed product.
  # --------------------------------------------------------------------------
  # - id: google-flow
  #   label: "Google AI Pro (Flow / Gemini)"
  #   access: ui
  #   priority: 3
  #
  #   url: https://labs.google/flow
  #   accounts: 7
  #   budget_per_account: 1000
  #   unit: flow-credits
  #
  #   subscription:
  #     seats: 7
  #     resets: monthly
  #     verified_on: "2026-07-26"
  #     balance_source: manual
  #
  #   models: [veo-3.1]
  #
  #   can: [video, video-with-audio, image-to-video]
  #   best_for: [physical-realism, text-legibility, native-audio, hero-shots, 4k]
  #   weak_at: [long-clips, automation]
  #
  #   max_clip_seconds: 8
  #
  #   manual_workflow:
  #     steps:
  #       - "Open Flow, pick the account with credits left"
  #       - "Paste the prompt from the generation packet"
  #       - "Set aspect ratio and duration as specified"
  #       - "Attach the reference image for image-to-video shots"
  #       - "Generate, download the MP4"
  #       - "Save as inbox/<shot-id>.mp4 using the packet's filename"
  #
  #   notes: >
  #     Programmatic access needs a separate billable API key — a different
  #     product from this subscription. Worth the manual step for hero shots
  #     and anything needing 4K.

  # --------------------------------------------------------------------------
  # Avatar / talking-head specialist. Subscription is UI; API bills separately.
  # --------------------------------------------------------------------------
  # - id: heygen
  #   label: "HeyGen"
  #   access: ui                     # api-paid only once you've bought credits
  #   protocol: heygen-like
  #   priority: 4
  #
  #   url: https://app.heygen.com
  #   accounts: 1
  #   budget_per_account: 200
  #   unit: premium-credits
  #
  #   subscription:
  #     resets: monthly
  #     balance_source: manual
  #
  #   api:
  #     endpoint: https://api.heygen.com
  #     auth_scheme: header
  #     auth_header: X-Api-Key
  #     auth_env: HEYGEN_API_KEY
  #     billing: pay-as-you-go
  #     separate_purchase: true
  #     est_cost_note: "Roughly $1 per minute of standard avatar video; premium
  #       tiers cost more. VERIFY CURRENT PRICING before buying."
  #
  #   can: [avatar-video, lipsync, talking-head, translation]
  #   best_for: [presenter, ugc-testimonial, spokesperson, multi-language]
  #   weak_at: [product-macro, cinematic-broll]

  # --------------------------------------------------------------------------
  # Usage-billed model marketplace. Cheap per call, but it IS new spend.
  # --------------------------------------------------------------------------
  # - id: fal
  #   label: "fal.ai"
  #   access: api-paid
  #   protocol: fal-like
  #   priority: 9
  #
  #   auth_scheme: key                 # Authorization: Key <key>
  #   auth_env: FAL_KEY
  #   accounts: 1
  #
  #   subscription:
  #     cost_per_month_usd: 0
  #     resets: never
  #     balance_source: api
  #
  #   can: [image, video, image-to-video, audio, upscale]
  #   best_for: [breadth, fallback, upscaling]
  #
  #   notes: >
  #     Pay-as-you-go per generation. Useful as a fallback when you need a model
  #     your subscriptions don't cover. Verify model slugs and prices before use.

  # --------------------------------------------------------------------------
  # BLANK TEMPLATE — copy this for anything not listed above.
  # Only id, label and access are required.
  # --------------------------------------------------------------------------
  # - id: my-platform               # short, lowercase, no spaces
  #   label: "Human-readable name"
  #   access: ui                    # api | ui | api-paid | host | off
  #   protocol: ""                  # magica-like | fal-like | heygen-like | host
  #   priority: 5                   # lower runs first
  #
  #   url: https://example.com      # where you generate, for ui platforms
  #   accounts: 1
  #   budget_per_account: 0         # credits per account; omit if unmetered
  #   unit: credits
  #
  #   # For access: api / api-paid
  #   endpoint: ""
  #   auth_scheme: bearer           # bearer | key | header
  #   auth_env: MY_PLATFORM_API_KEY
  #   # auth_env_pattern: MY_PLATFORM_API_KEY_{n}   # for several accounts
  #
  #   subscription:                 # all fields optional
  #     plan: ""
  #     seats: 1
  #     cost_per_month_usd: 0
  #     credits_per_month: 0
  #     resets: monthly             # monthly | daily | never
  #     renews_on: ""               # YYYY-MM-DD — drives expiry warnings
  #     verified_on: ""             # YYYY-MM-DD — when you last checked
  #     balance_source: manual      # manual | api
  #
  #   models: []                    # so inventory can spot host overlap
  #   can: []                       # image, video, image-to-video, audio, tts,
  #                                 # lipsync, avatar-video, video-with-audio
  #   best_for: []
  #   weak_at: []
  #   max_clip_seconds: 0
  #
  #   manual_workflow:              # for access: ui
  #     steps:
  #       - "Open the app and pick an account with credits"
  #       - "Paste the prompt from the packet"
  #       - "Generate, download, save as inbox/<shot-id>.mp4"
  #
  #   notes: >
  #     Anything the agent should know: quirks, billing surprises, model ids,
  #     where to find the API key.


# ============================================================================
# DESTINATIONS — where finished ads go. Drives export formats and the variant
# registry that stops the same cut appearing on two accounts.
# ============================================================================
destinations:
  - id: ig_main
    platform: instagram
    handle: "@your_handle"
    formats: [reels, feed_4x5]
    audience: "primary brand audience"

  # - id: tiktok_main
  #   platform: tiktok
  #   handle: "@your_tiktok"
  #   formats: [tiktok]
  #   audience: "younger, sound-on"


# ============================================================================
# BRAND — optional, but it makes every ad more consistent.
# ============================================================================
brand:
  name: ""
  colors: []                       # e.g. ["#0A2540", "#F5C518"]
  fonts: []
  logo: ""                         # path to a transparent PNG
  tone: ""                         # e.g. "warm, plain-spoken, never salesy"
  claims_to_avoid: []              # regulated or unprovable claims
  recurring_characters: []         # names; refs live in the campaign registry
